[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kitty-scratch"
version = "0.1.2"
description = "Compile Python syntax into Scratch 3 projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "kitty_player/vendor/licenses/*"]
dependencies = []
authors = [
  { name = "Thayaden Pi", email = "thayaden_pi@proton.me" },
]

[project.urls]
Documentation = "https://github.com/pi-3-14159265/kitty/wiki"
Repository = "https://github.com/pi-3-14159265/kitty"
Issues = "https://github.com/pi-3-14159265/kitty/issues"

[project.scripts]
kitty = "cli:main"
kitty-build = "comp:main"
kitty-decomp = "decomp:main"

[tool.setuptools]
py-modules = ["kitty", "comp", "decomp", "cli"]
packages = ["kitty_player"]

[tool.setuptools.package-data]
kitty_player = ["player.html", "vendor/*.js", "vendor/chunks/*.js", "vendor/SOURCES.txt", "vendor/licenses/*"]

[tool.setuptools.data-files]
"." = ["kitty.pyi"]
