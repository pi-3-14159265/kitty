[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kitty-scratch"
version = "0.2.0"
description = "Compile Python syntax into Scratch 3 projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [
  { name = "Thayaden Pi", email = "thayaden_pi@proton.me" },
]

[project.urls]
Documentation = "https://github.com/pi-3-14159265/kitty/wiki"
Repository = "https://github.com/pi-3-14159265/kitty"
Issues = "https://github.com/pi-3-14159265/kitty/issues"

[project.scripts]
kitty = "cli:main"
kitty-build = "comp:main"
kitty-decomp = "decomp:main"

[tool.setuptools]
py-modules = ["kitty", "comp", "decomp", "cli"]
# The vendor folders hold no Python, but setuptools needs them listed to ship their files.
packages = ["kitty_player", "kitty_player.vendor", "kitty_player.vendor.chunks", "kitty_player.vendor.licenses"]

[tool.setuptools.package-data]
kitty_player = ["player.html"]
"kitty_player.vendor" = ["*.js", "SOURCES.txt"]
"kitty_player.vendor.chunks" = ["*.js"]
"kitty_player.vendor.licenses" = ["*"]

[tool.setuptools.data-files]
"." = ["kitty.pyi"]
